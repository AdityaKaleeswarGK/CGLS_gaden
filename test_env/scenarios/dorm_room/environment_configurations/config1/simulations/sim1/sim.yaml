source:
  sourceType: point
  position: [3.8, 1.8, 0.5]  # fire toward the bottom of the (now longer) room
  gasType: 11  # carbonDioxide (fire combustion product; specific gravity 1.52 -> sinks)
deltaTime: 0.1
windIterationDeltaTime: 1
temperature: 298
pressure: 1
filamentPPMcenter: 10   # subtle, controlled CO2 release (was 20 -> too much)
filamentInitialSigma: 10
filamentGrowthGamma: 20  # filaments grow faster -> plume spreads through the room
filamentNoise_std: 0.07  # more turbulent dispersion -> also creeps backward/below the source
numFilaments_sec: 5      # controlled emission rate (was 10)
expectedNumIterations: 1000  # longer room: time to vent + slowly spread backward
saveResults: true
saveDeltaTime: 0.5
preCalculateConcentrations: false
windLooping:
  loop: true
  from: 0
  to: 5
