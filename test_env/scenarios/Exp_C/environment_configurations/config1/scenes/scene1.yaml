playback_initial_iteration: 100
playback_loop:
  loop: false
  from: 0
  to: 0
simulations:
  - sim: sim1
    gas_color: [1.0, 0.0, 0.0] # Red (Fast)
  - sim: sim2
    gas_color: [0.0, 1.0, 0.0] # Green (Slow)
  - sim: sim3
    gas_color: [0.0, 0.0, 1.0] # Blue (Moderate)
  - sim: sim4
    gas_color: [1.0, 1.0, 0.0] # Yellow (Very Slow)